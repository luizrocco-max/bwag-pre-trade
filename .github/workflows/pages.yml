name: Publicar dashboard no GitHub Pages

on:
  push:
    branches: [claude/dashboard-pre-trade-f5079e]
    paths: [dashboard.html, docs/**, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Pages (auto-habilita)
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Montar site
        run: |
          mkdir -p _site/docs
          cp dashboard.html _site/index.html
          cp docs/manual.html _site/docs/manual.html

      - name: Enviar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
